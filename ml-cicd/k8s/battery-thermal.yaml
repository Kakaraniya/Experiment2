apiVersion: apps/v1
kind: Deployment
metadata:
  name: battery-thermal-ml
  labels:
    app: battery-thermal-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: battery-thermal-ml
  template:
    metadata:
      labels:
        app: battery-thermal-ml
    spec:
      containers:
        - name: api
          image: battery-thermal-ml:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ABNORMAL_TEMPERATURE_THRESHOLD_C
              value: "60.0"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: battery-thermal-ml
  labels:
    app: battery-thermal-ml
spec:
  selector:
    app: battery-thermal-ml
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: battery-thermal-ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: battery-thermal-ml
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70