name: ml-cicd

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-cicd/requirements.txt

      - name: Create sample dataset
        run: python ml-cicd/scripts/generate_sample_data.py

      - name: Run code quality checks
        run: python -m ruff check ml-cicd/src ml-cicd/tests ml-cicd/scripts

      - name: Train model
        run: python -m src.train --data-path data/battery_thermal_sensor.csv --model-dir models --threshold 1.5
        working-directory: ml-cicd

      - name: Run unit tests
        run: python -m pytest -q
        working-directory: ml-cicd

      - name: Validate model performance
        run: python -m src.validate_model --data-path data/battery_thermal_sensor.csv --model-dir models --threshold 1.5
        working-directory: ml-cicd

      - name: Build Docker image
        run: docker build -t battery-thermal-ml:${{ github.sha }} ml-cicd

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ml-cicd
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ml-cicd:latest
            ghcr.io/${{ github.repository_owner }}/ml-cicd:${{ github.sha }}