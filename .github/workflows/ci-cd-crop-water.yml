name: crop-water-ml-cicd

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Check out source code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: crop-water
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Dependency vulnerability scanning
      - name: Scan Python dependencies
        working-directory: crop-water
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # 5. Code quality check
      - name: Run code quality checks
        working-directory: crop-water
        run: |
          pip install ruff
          ruff check .

      # 6. Train ML model
      - name: Train crop water prediction model
        working-directory: crop-water
        run: |
          python train.py

      # 7. Run unit tests
      - name: Run unit tests
        working-directory: crop-water
        run: |
          pip install pytest
          pytest -q

      # 8. Validate trained model
      - name: Validate model
        working-directory: crop-water
        run: |
          python train.py --validate

      # 9. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t crop-water-ml:${{ github.sha }} \
            crop-water

      # 10. Scan Docker image for vulnerabilities
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: crop-water-ml:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 11. Secret scanning
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 13. Build and push Docker image
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./crop-water
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crop-water:latest
            ghcr.io/${{ github.repository_owner }}/crop-water:${{ github.sha }}